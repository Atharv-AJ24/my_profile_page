apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-profile-page
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-profile-page
  template:
    metadata:
      labels:
        app: my-profile-page
    spec:
      containers:
        - name: my-profile-page
          image: my-profile-page:latest
          ports:
            - containerPort: 80